[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "print-generator-sdk"          # nome no pip (com hífen)
version = "0.1.0"
description = "Contract shared by every Print-Platform parametric product"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13",
    "numpy>=2.0",
    "trimesh>=4.0",
    "manifold3d>=3.0",
]

[project.optional-dependencies]
dev = ["pytest"]                      # só pra quem desenvolve: pip install -e ".[dev]"

[tool.setuptools.packages.find]
where = ["src"]                       # o código fica dentro de src/

[tool.pytest.ini_options]
testpaths = ["tests"]